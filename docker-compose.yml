version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: watchlist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  app:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 todo.wsgi:application
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=ta_cle_secrete_production
      - DATABASE_URL=postgres://postgres:mysecretpassword@db:5432/watchlist_db
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data: