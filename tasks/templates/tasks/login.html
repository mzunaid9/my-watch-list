{% load socialaccount %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Watchlist</title>
    <!-- Utilise ton CSS habituel ici -->
</head>
<body>
    <div style="width: 300px; margin: 50px auto;">
        <h2>Connexion</h2>
        
        {% if form.errors %}
            <p style="color: red;">Nom d'utilisateur ou mot de passe incorrect.</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Se connecter</button>
        </form>
        
        <hr style="margin: 20px 0;">

        <div>
            <a href="{% provider_login_url 'google' %}" style="display: block; text-align: center; padding: 10px; background-color: #4285F4; color: white; text-decoration: none; border-radius: 4px;">
                Se connecter avec Google
            </a>
        </div>

        <p style="margin-top: 20px;">Pas encore de compte ? <a href="{% url 'register' %}">Inscris-toi</a></p>
    </div>
</body>
</html>
